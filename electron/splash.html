<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S Bamboo Cottage POS</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0b0f17;
      --surface:     #141927;
      --border:      #1e2740;
      --text-100:    #f1f5f9;
      --text-400:    #94a3b8;
      --text-500:    #64748b;
      --amber:       #f59e0b;
      --amber-glow:  #fbbf24;
      --track:       #1e2740;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .shell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%; height: 100%;
      gap: 0;
      padding: 36px 40px 28px;
    }

    /* ── Logo ───────────────────────────────────────────── */
    .logo-wrap {
      width: 88px; height: 88px;
      border-radius: 22px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 26px;
      box-shadow: 0 0 32px 0 rgba(245, 158, 11, 0.12);
      overflow: hidden;
      flex-shrink: 0;
    }
    .logo-wrap img {
      width: 68px; height: 68px;
      object-fit: contain;
    }
    /* Fallback when image is missing */
    .logo-fallback {
      font-size: 36px;
      line-height: 1;
    }

    /* ── Text ───────────────────────────────────────────── */
    .title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-100);
      text-align: center;
      line-height: 1.35;
      letter-spacing: -0.01em;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--amber);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 40px;
    }

    /* ── Progress track ─────────────────────────────────── */
    .track-wrap {
      width: 260px;
      margin-bottom: 16px;
    }
    .track {
      width: 100%;
      height: 4px;
      background: var(--track);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }
    .beam {
      position: absolute;
      top: 0; left: -40%;
      width: 40%;
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(
        90deg,
        transparent 0%,
        var(--amber) 50%,
        var(--amber-glow) 75%,
        transparent 100%
      );
      box-shadow: 0 0 8px 2px rgba(251, 191, 36, 0.55);
      animation: sweep 1.6s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes sweep {
      0%   { left: -40%; }
      100% { left: 110%; }
    }

    .status {
      font-size: 11.5px;
      color: var(--text-400);
      text-align: center;
      letter-spacing: 0.01em;
    }

    /* ── Spacer + footer ────────────────────────────────── */
    .spacer { flex: 1; }
    .footer {
      font-size: 11px;
      color: var(--text-500);
      text-align: center;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="logo-wrap">
      <img
        src="assets/icon.png"
        alt="Bamboo POS Logo"
        onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
      />
      <span class="logo-fallback" style="display:none;">🏕️</span>
    </div>

    <div class="title">S Bamboo Cottage &amp; Sekuwa Corner</div>
    <div class="subtitle">Smart POS Terminal</div>

    <div class="track-wrap">
      <div class="track">
        <div class="beam"></div>
      </div>
    </div>

    <div class="status">Initializing system engine &amp; hardware...</div>

    <div class="spacer"></div>
    <div class="footer">Designed &amp; Developed by Shramik</div>
  </div>
</body>
</html>
